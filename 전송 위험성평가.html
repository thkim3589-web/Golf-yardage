<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장 위험성 평가표(전송) 작성</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 10px; max-width: 480px; margin: auto; background:#f8f9fa; }
.form { display:flex; flex-direction:column; gap:10px; background:#fff; padding:15px; border-radius:8px; }
label { display:flex; flex-direction:column; font-size:14px; font-weight:bold; margin-bottom:5px; }
.checkbox-group { display:flex; flex-direction:column; gap:8px; margin-top:5px; }
.checkbox-group label { flex-direction:row; align-items:flex-start; font-weight:normal; cursor:pointer; gap:8px; }
input[type="text"], input[type="datetime-local"] { padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:4px; }
input[type="checkbox"] { width:18px; height:18px; flex:0 0 auto; margin-top:1px; }
details { border:1px solid #eee; padding:10px; border-radius:4px; margin-bottom:5px; }
summary { font-weight:bold; cursor:pointer; padding:5px 0; }
.etc-input { display:none; margin-top:10px; padding-left:10px; border-left:3px solid #007bff; }
.fixed-note { font-size:13px; color:#28a745; font-weight:bold; }
.risk-block { border-top:1px dashed #ccc; padding-top:8px; margin-top:8px; }
.risk-title { font-weight:bold; color:#333; margin-bottom:4px; }
.inline { flex-direction:row; align-items:center; gap:6px; font-weight:normal; }
.combo { position:relative; }
.combo-list { position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto; margin:4px 0 0; padding:0; list-style:none; border:1px solid #bbb; border-radius:4px; background:#fff; z-index:50; display:none; box-shadow:0 4px 10px rgba(0,0,0,0.15); }
.combo-list.show { display:block; }
.combo-list li { padding:10px; font-weight:normal; cursor:pointer; border-bottom:1px solid #eee; font-size:14px; }
.combo-list li:hover { background:#eaf2ff; }
.combo-list li.empty { color:#999; cursor:default; }
.hidden { display:none; }
.risk-children { padding-left:18px; margin-top:4px; }
.clear-btn { align-self:flex-start; background:#6c757d; color:#fff; border:none; border-radius:4px; padding:6px 10px; font-size:12px; cursor:pointer; }
.iphone-notice { font-size:12px; color:#d9534f; text-align:center; margin:10px 0; }
.save-btn { background:#007bff; color:#fff; padding:12px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; }
#result-container { margin-top:20px; width:100%; text-align:center; }
#final-image { width:100%; height:auto; border:2px solid #333; border-radius:4px; box-shadow:0 4px 10px rgba(0,0,0,0.2); }
/* 날씨 연동 버튼 스타일 추가 */
.weather-btn { background: #17a2b8; color: white; border: none; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: normal; vertical-align: middle; }
.weather-btn:hover { background: #138496; }
</style>
</head>
<body>
<h2>현장 위험성 평가표(전송) 작성</h2>
<div class="form">

<p class="fixed-note">도급사명: SKO (고정)</p>
<label>시작일시 <input type="datetime-local" id="start_date" oninput="generateImage()"></label>
<label>종료일시 <input type="datetime-local" id="end_date" oninput="generateImage()"></label>
<label><span>국소명(주소) <span style="color:red">*</span></span> <input type="text" id="location" oninput="generateImage()"></label>
<label><span>작업공종 <span style="color:red">*</span></span>
  <div class="combo">
    <input type="text" id="what_do" placeholder="작업공종 선택 또는 검색" autocomplete="off" oninput="onWorkInput()" onfocus="openWorkList()" onclick="openWorkList()">
    <ul id="work_list" class="combo-list"></ul>
  </div>
</label>
<label class="inline"><input type="checkbox" id="what_do_manual" onchange="toggleManualWorkType()"> 수기입력(목록에 없을 때 직접 입력)</label>
<label><span>투입인원(성함) <span style="color:red">*</span></span> <input type="text" id="inspector" placeholder="투입인원(성함)" oninput="generateImage()"></label>

<details open>
  <summary>기상현황 / 온도 <span style="color:red">*</span> <button type="button" class="weather-btn" onclick="updateLocationWeather()">현위치 날씨 연동</button></summary>
  <div class="checkbox-group">
    <label><input type="checkbox" id="weather_clear" value="weather_clear" onchange="generateImage()"> 맑음</label>
    <label><input type="checkbox" id="weather_wind" value="weather_wind" onchange="generateImage()"> 강풍</label>
    <label><input type="checkbox" id="weather_rain" value="weather_rain" onchange="generateImage()"> 비/눈</label>
    <label><input type="checkbox" id="weather_hot" value="weather_hot" onchange="generateImage()"> 폭염</label>
    <label><input type="checkbox" id="weather_cold" value="weather_cold" onchange="generateImage()"> 한파</label>
  </div>
  <label>체감온도 <input type="text" id="fake_temperature" oninput="generateImage()"></label>
  <label>기온 <input type="text" id="real_temperature" oninput="generateImage()"></label>
</details>

<details>
  <summary>건설장비</summary>
  <div class="checkbox-group">
    <label><input type="checkbox" id="cb_m_crane" value="m_crane" onchange="toggleEtc('cb_m_crane','wrap_crane')"> 크레인</label>
    <div id="wrap_crane" class="etc-input"><input type="text" id="crane_text" placeholder="크레인 종류/톤수" oninput="generateImage()"></div>
    <label><input type="checkbox" value="m_truck_lift" onchange="generateImage()"> 차량탑재형 고소작업대</label>
    <label><input type="checkbox" value="m_scissor" onchange="generateImage()"> 시저형 고소작업대</label>
    <label><input type="checkbox" value="m_forklift" onchange="generateImage()"> 지게차</label>
    <label><input type="checkbox" value="m_dump" onchange="generateImage()"> 덤프트럭</label>
    <label><input type="checkbox" value="m_excavator" onchange="generateImage()"> 굴착기</label>
    <label><input type="checkbox" value="m_roller" onchange="generateImage()"> 롤러</label>
    <label><input type="checkbox" value="m_loader" onchange="generateImage()"> 로더</label>
    <label><input type="checkbox" value="m_pump" onchange="generateImage()"> 펌프카</label>
    <label><input type="checkbox" id="cb_m_etc" value="m_etc" onchange="toggleEtc('cb_m_etc','wrap_m_etc')"> 기타</label>
    <div id="wrap_m_etc" class="etc-input"><input type="text" id="machine_etc_text" placeholder="기타 장비" oninput="generateImage()"></div>
  </div>
</details>

<label>신호수 <input type="text" id="come_here" oninput="generateImage()"></label>
<label>유도자 <input type="text" id="whatch_me" oninput="generateImage()"></label>
<label><span>관리감독자 성함(팀장) <span style="color:red">*</span></span> <input type="text" id="manager_name" oninput="generateImage(); saveNames();"></label>
<label><span>발주처LM 성함 <span style="color:red">*</span></span> <input type="text" id="lm_name" oninput="generateImage(); saveNames();"></label>
<label class="inline"><input type="checkbox" id="remember_names" onchange="onRememberToggle()"> 관리감독자/발주처LM 성함 기억하기(이 기기)</label>
<button type="button" class="clear-btn" onclick="clearSavedNames()">저장값 지우기</button>

<details>
  <summary>현장특성 <span style="color:red">*</span></summary>
  <div class="checkbox-group">
    <label><input type="checkbox" value="site_road_edge" onchange="generateImage()"> 도로 가장 차선</label>
    <label><input type="checkbox" value="site_road_center" onchange="generateImage()"> 도로 중앙 차선(사이 차선, 교차로 포함)</label>
    <label><input type="checkbox" value="site_alley" onchange="generateImage()"> 골목길/농로/비포장</label>
    <label><input type="checkbox" value="site_bridge" onchange="generateImage()"> 교량/지하차도/터널</label>
    <label><input type="checkbox" value="site_indoor" onchange="generateImage()"> 구내(건물 안)</label>
    <label><input type="checkbox" value="site_roof" onchange="generateImage()"> 옥상/옥탑</label>
    <label><input type="checkbox" value="site_manhole" onchange="generateImage()"> 맨홀(수공/인공)내 작업</label>
    <label><input type="checkbox" value="site_pipe" onchange="generateImage()"> 관로작업 구간</label>
    <label><input type="checkbox" value="site_soft_ground" onchange="generateImage()"> 연약지반/비탈면(낙석위험 구간)</label>
    <label><input type="checkbox" value="site_power" onchange="generateImage()"> 전력선/변압기 근접</label>
    <label><input type="checkbox" value="site_taas" onchange="generateImage()"> 교통사고 다발지역(TAAS)</label>
    <label><input type="checkbox" id="cb_site_etc" value="site_etc" onchange="toggleEtc('cb_site_etc','wrap_site_etc')"> 기타</label>
    <div id="wrap_site_etc" class="etc-input"><input type="text" id="site_etc_text" placeholder="현장특성 기타" oninput="generateImage()"></div>
  </div>
  <label>현장 특이사항 <input type="text" id="site_special" placeholder="현장특성 체크 항목에 대한 특이사항" oninput="generateImage()"></label>
</details>

<details>
  <summary>공통사항 <span style="color:red">*</span></summary>
  <div class="checkbox-group">
    <label><input type="checkbox" value="common_ppe" onchange="generateImage()"> 개인보호구 착용 및 주변 동료 보호구 착용 상태 확인</label>
    <label><input type="checkbox" value="common_machine" onchange="generateImage()"> 건설장비 안전장치 확인(고소차, 굴착기, 크레인 등)</label>
    <label><input type="checkbox" value="common_health" onchange="generateImage()"> 팀원 건강상태 / 컨디션 확인</label>
    <label><input type="checkbox" value="common_tool" onchange="generateImage()"> 공도구 사용 전 점검</label>
    <label><input type="checkbox" value="common_stop" onchange="generateImage()"> 작업중지 기준 준수(폭염/한파/강풍/강우/강설)</label>
    <label><input type="checkbox" value="common_hazard" onchange="generateImage()"> 작업장 유해 위험요인 확인[유해충 및 구조물(고정,균열 상태)]</label>
    <label><input type="checkbox" value="common_heavy" onchange="generateImage()"> 중량물 정보 및 취급에 관한 사항 확인</label>
  </div>
</details>

<details>
  <summary>혹서기 용품 지참유무 (7~9월 필수)</summary>
  <div class="checkbox-group">
    <label><input type="checkbox" value="hot_thermo" onchange="generateImage()"> 온습도계</label>
    <label><input type="checkbox" value="hot_ice_water" onchange="generateImage()"> 얼음물</label>
    <label><input type="checkbox" value="hot_icebox" onchange="generateImage()"> 아이스박스</label>
    <label><input type="checkbox" value="hot_salt" onchange="generateImage()"> 식염정</label>
    <label><input type="checkbox" value="hot_rest" onchange="generateImage()"> 휴게시설(파라솔 등)</label>
    <label><input type="checkbox" id="cb_hot_etc" value="hot_etc" onchange="toggleEtc('cb_hot_etc','wrap_hot_etc')"> 기타</label>
    <div id="wrap_hot_etc" class="etc-input"><input type="text" id="hot_etc_text" placeholder="혹서기 기타" oninput="generateImage()"></div>
  </div>
</details>

<details>
  <summary>혹한기 용품 지참유무 (12월~2월 필수)</summary>
  <div class="checkbox-group">
    <label><input type="checkbox" value="cold_hotpack" onchange="generateImage()"> 핫팩</label>
    <label><input type="checkbox" value="cold_vest" onchange="generateImage()"> 발열조끼</label>
    <label><input type="checkbox" id="cb_cold_etc" value="cold_etc" onchange="toggleEtc('cb_cold_etc','wrap_cold_etc')"> 기타</label>
    <div id="wrap_cold_etc" class="etc-input"><input type="text" id="cold_etc_text" placeholder="혹한기 기타" oninput="generateImage()"></div>
  </div>
</details>

<label><span>추가 위험요인 (체크항목 외) <span style="color:red">*</span></span>
  <input type="text" id="danger_point" placeholder="추가 위험요인 (없으면 '특이사항 없음')" oninput="generateImage()">
</label>
<label><span>추가 안전대책 <span style="color:red">*</span></span>
  <input type="text" id="danger_todo" placeholder="안전대책" oninput="generateImage()">
</label>

<details>
  <summary>작업 전 확인 내용 (위험요인 / 안전대책) <span style="color:red">*</span></summary>
  <div class="risk-block">
    <div class="risk-title">떨어짐 / 사다리</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_fall" onchange="toggleRiskChildren('riskgrp_0')"> [위험요인] 떨어짐</label>
      <label><input type="checkbox" value="risk_ladder" onchange="toggleRiskChildren('riskgrp_0')"> [위험요인] 사다리 상부 가로서기(자세) 작업</label>
      <div id="riskgrp_0" class="risk-children hidden">
        <label><input type="checkbox" value="fall_pole" onchange="generateImage()"> 전주 균열/전주 수직상태/수직사다리 고정</label>
        <label><input type="checkbox" value="fall_lifeline" onchange="generateImage()"> 난간이 없는 옥상/옥탑/경사지붕 수평생명줄 설치 및 안전고리 체결</label>
        <label><input type="checkbox" value="fall_hook" onchange="generateImage()"> 고소차 작업의 경우 작업지점 도달 시 안전고리 체결</label>
        <label><input type="checkbox" value="fall_no_move" onchange="generateImage()"> 고소차 이동작업 금지</label>
        <label><input type="checkbox" value="fall_ladder_guide" onchange="generateImage()"> 사다리 안전작업 지침 준수(2인1조, 최상단 및 차상단 작업금지, 안전고리 체결)</label>
        <label><input type="checkbox" value="fall_ladder_cross" onchange="generateImage()"> 사다리 작업중 가로질러 넘어가는 과정에서 안전대 체결</label>
      </div>
    </div>
  </div>
  <div class="risk-block">
    <div class="risk-title">주행차량에 의한 교통사고</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_traffic" onchange="toggleRiskChildren('riskgrp_1')"> [위험요인] 주행차량에 의한 교통사고</label>
      <div id="riskgrp_1" class="risk-children hidden">
        <label><input type="checkbox" value="traffic_facility" onchange="generateImage()"> 안전시설물 설치 또는 차단 전문업체 활용(에어로봇, 안전표지판, 방호차량, 컬러콘)</label>
        <label><input type="checkbox" value="traffic_signal" onchange="generateImage()"> 신호수 배치 및 신호체계 수립</label>
      </div>
    </div>
  </div>
  <div class="risk-block">
    <div class="risk-title">맨홀(지중) 작업 시 질식위험</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_suffocate" onchange="toggleRiskChildren('riskgrp_2')"> [위험요인] 맨홀(지중) 작업 시 질식위험</label>
      <div id="riskgrp_2" class="risk-children hidden">
        <label><input type="checkbox" value="suffocate_vent" onchange="generateImage()"> 맨홀 환기조치</label>
        <label><input type="checkbox" value="suffocate_gas" onchange="generateImage()"> 산소농도 및 유해가스 농도 측정(복합가스농도측정기 작동 확인)</label>
      </div>
    </div>
  </div>
  <div class="risk-block">
    <div class="risk-title">건설장비에 부딪힘/끼임</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_machine_hit" onchange="toggleRiskChildren('riskgrp_3')"> [위험요인] 건설장비에 부딪힘/끼임</label>
      <div id="riskgrp_3" class="risk-children hidden">
        <label><input type="checkbox" value="machine_guide" onchange="generateImage()"> 장비 유도자 배치 및 운전원과 신호체계 수립</label>
        <label><input type="checkbox" value="machine_keepout" onchange="generateImage()"> 작업반경 내 접근금지</label>
      </div>
    </div>
  </div>
  <div class="risk-block">
    <div class="risk-title">넘어짐(인력/건설장비)</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_fall_over" onchange="toggleRiskChildren('riskgrp_4')"> [위험요인] 넘어짐(인력/건설장비)</label>
      <div id="riskgrp_4" class="risk-children hidden">
        <label><input type="checkbox" value="fallover_path" onchange="generateImage()"> 이동통로 정리정돈, 결빙/물기 제거</label>
        <label><input type="checkbox" value="fallover_ground" onchange="generateImage()"> 작업 전 지반상태 확인</label>
        <label><input type="checkbox" value="fallover_spec" onchange="generateImage()"> 건설장비는 허용된 제원 내 운행</label>
        <label><input type="checkbox" value="fallover_outrigger" onchange="generateImage()"> 아웃트리거 수평인출 및 받침대 설치</label>
        <label><input type="checkbox" value="fallover_chock" onchange="generateImage()"> 작업차량 고임목 설치</label>
      </div>
    </div>
  </div>
  <div class="risk-block">
    <div class="risk-title">감전</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_electric" onchange="toggleRiskChildren('riskgrp_5')"> [위험요인] 감전</label>
      <div id="riskgrp_5" class="risk-children hidden">
        <label><input type="checkbox" value="electric_detector" onchange="generateImage()"> 전주 승주 전 검전기로 누설전류 확인</label>
        <label><input type="checkbox" value="electric_neutral" onchange="generateImage()"> 중성선 혼촉 여부 확인</label>
      </div>
    </div>
  </div>
  <div class="risk-block">
    <div class="risk-title">낙하물 발생</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_drop" onchange="toggleRiskChildren('riskgrp_6')"> [위험요인] 낙하물 발생</label>
      <div id="riskgrp_6" class="risk-children hidden">
        <label><input type="checkbox" value="drop_keepout" onchange="generateImage()"> 작업반경 내 접근금지(통제)</label>
        <label><input type="checkbox" value="drop_lifting" onchange="generateImage()"> 승인된 인양도구 사용(슬링밸트, 샤클 등)</label>
      </div>
    </div>
  </div>
  <div class="risk-block">
    <div class="risk-title">화재, 폭발</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_fire" onchange="toggleRiskChildren('riskgrp_7')"> [위험요인] 화재, 폭발</label>
      <div id="riskgrp_7" class="risk-children hidden">
        <label><input type="checkbox" value="fire_remove" onchange="generateImage()"> 화기작업 주변 인화물 제거, 소화기 비치</label>
        <label><input type="checkbox" value="fire_flashback" onchange="generateImage()"> 역화방지기, 압력게이지 설치 및 호스 노후 확인</label>
        <label><input type="checkbox" value="fire_heater" onchange="generateImage()"> 승인된 전열기구 사용</label>
      </div>
    </div>
  </div>
  <div class="risk-block">
    <div class="risk-title">매몰</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="risk_bury" onchange="toggleRiskChildren('riskgrp_8')"> [위험요인] 매몰</label>
      <div id="riskgrp_8" class="risk-children hidden">
        <label><input type="checkbox" value="bury_slope" onchange="generateImage()"> 굴착구배 준수 및 낙석제거</label>
        <label><input type="checkbox" value="bury_keepout" onchange="generateImage()"> 굴착구간 임의 접근 금지, 유도자 통제 준수</label>

<script>
// 기상청 격자 변환 및 API 연동용 기능 스크립트 선언
function dfs_xy_conv(code, v1, v2) {
    const RE = 6371.00877; const GRID = 5.0; const SLAT1 = 30.0; const SLAT2 = 60.0;
    const OLON = 126.0; const OLAT = 38.0; const XO = 43; const YO = 136;
    const DEGRAD = Math.PI / 180.0; const re = RE / GRID; const Minister1 = SLAT1 * DEGRAD;
    const Minister2 = SLAT2 * DEGRAD; const olon = OLON * DEGRAD; const olat = OLAT * DEGRAD;
    let sn = Math.tan(Math.PI * 0.25 + Minister2 * 0.5) / Math.tan(Math.PI * 0.25 + Minister1 * 0.5);
    sn = Math.log(Math.cos(Minister1) / Math.cos(Minister2)) / Math.log(sn);
    let sf = Math.tan(Math.PI * 0.25 + Minister1 * 0.5); sf = Math.pow(sf, sn) * Math.cos(Minister1) / sn;
    let ro = Math.tan(Math.PI * 0.25 + olat * 0.5); ro = re * sf / Math.pow(ro, sn); let rs = {};
    if (code == "toXY") {
        rs['lat'] = v1; rs['lng'] = v2;
        let ra = Math.tan(Math.PI * 0.25 + (v1) * DEGRAD * 0.5); ra = re * sf / Math.pow(ra, sn);
        let theta = v2 * DEGRAD - olon; if (theta > Math.PI) theta -= 2.0 * Math.PI;
        if (theta < -Math.PI) theta += 2.0 * Math.PI; theta *= sn;
        rs['x'] = Math.floor(ra * Math.sin(theta) + XO + 0.5); rs['y'] = Math.floor(ro - ra * Math.cos(theta) + YO + 0.5);
    }
    return rs;
}

function getBaseDateTime() {
    const now = new Date();
    if (now.getMinutes() < 40) { now.setHours(now.getHours() - 1); }
    const yyyymmdd = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
    const hh00 = String(now.getHours()).padStart(2, '0') + '00';
    return { baseDate: yyyymmdd, baseTime: hh00 };
}

function calculateSensoryTemp(T, V_ms) {
    if (!V_ms) return T;
    const V_kmh = V_ms * 3.6;
    if (T <= 10) {
        return Math.round(13.12 + 0.6215 * T - 11.37 * Math.pow(V_kmh, 0.16) + 0.3965 * T * Math.pow(V_kmh, 0.16));
    } else if (T >= 20) {
        return Math.round(T); // 여름철 공식은 습도가 정밀하게 필요하므로 실황 기온과 유사 세팅
    }
    return Math.round(T);
}

async function updateLocationWeather() {
    if (!navigator.geolocation) { alert("이 브라우저에서는 위치 기반 날씨를 지원하지 않습니다."); return; }
    alert("현위치 기상청 정보를 조회합니다. (위치 권한을 동의해 주세요)");
    
    navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const grid = dfs_xy_conv("toXY", lat, lng);
        const { baseDate, baseTime } = getBaseDateTime();

        // 발급 받으신 공공데이터포털 인코딩/디코딩 인증키를 아래에 대입하여 사용하세요.
        const serviceKey = "YOUR_PUBLIC_DATA_API_KEY"; 
        const url = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?serviceKey=${serviceKey}&pageNo=1&numOfRows=10&dataType=JSON&base_date=${baseDate}&base_time=${baseTime}&nx=${grid.x}&ny=${grid.y}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.response && data.response.header.resultCode === "00") {
                const items = data.response.body.items.item;
                let t1h = 0; let wsd = 0; let pty = 0;
                
                items.forEach(item => {
                    if (item.category === "T1H") t1h = parseFloat(item.obsrValue);
                    if (item.category === "WSD") wsd = parseFloat(item.obsrValue);
                    if (item.category === "PTY") pty = parseInt(item.obsrValue); // 강수형태
                });

                document.getElementById("real_temperature").value = t1h + "°C";
                const sensoryTemp = calculateSensoryTemp(t1h, wsd);
                document.getElementById("fake_temperature").value = sensoryTemp + "°C";

                // 기상 현황 체크박스 상태 제어 제안 자동화
                document.getElementById("weather_clear").checked = (pty === 0);
                document.getElementById("weather_rain").checked = (pty > 0);
                document.getElementById("weather_wind").checked = (wsd >= 8); // 풍속 8m/s 이상 시 강풍 체크
                document.getElementById("weather_hot").checked = (t1h >= 33); // 33도 이상 폭염
                document.getElementById("weather_cold").checked = (t1h <= -12); // 한파 기준

                if (typeof generateImage === "function") generateImage();
                alert("기상청 실황 날씨 정보 연동에 성공했습니다.");
            } else {
                alert("기상 데이터를 수신했으나 실패코드가 반환되었습니다. API 키를 확인해 주세요.");
            }
        } catch (error) {
            console.error(error);
            alert("기상청 API 연동 도중 에러가 발생했습니다.");
        }
    }, (err) => {
        alert("위치 정보를 가져오는 데 실패했습니다. 권한 설정을 확인하세요.");
    });
}

// 작업공종 데이터 세팅
const works = [
  "민원선로 정비 및 이전공사", "광케이블 신설 및 포설", "가공선로 포설", "지중선로 철거", "맨홀 점검 및 청소", "기타 수기입력"
];

function onWorkInput() {
  const v = document.getElementById("what_do").value.toLowerCase();
  const list = document.getElementById("work_list");
  list.innerHTML = "";
  const filtered = works.filter(w => w.toLowerCase().includes(v));
  if(filtered.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.innerText = "검색 결과가 없습니다.";
    list.appendChild(li);
  } else {
    filtered.forEach(w => {
      const li = document.createElement("li");
      li.innerText = w;
      li.onclick = () => selectWork(w);
      list.appendChild(li);
    });
  }
}

function openWorkList() {
  if(document.getElementById("what_do_manual").checked) return;
  onWorkInput();
  document.getElementById("work_list").classList.add("show");
}

function selectWork(w) {
  document.getElementById("what_do").value = w;
  document.getElementById("work_list").classList.remove("show");
  generateImage();
}

function toggleManualWorkType() {
  const m = document.getElementById("what_do_manual").checked;
  const inp = document.getElementById("what_do");
  inp.value = "";
  if(m) {
    inp.placeholder = "직접 내용을 입력하세요";
    document.getElementById("work_list").classList.remove("show");
  } else {
    inp.placeholder = "작업공종 선택 또는 검색";
  }
  generateImage();
}

document.addEventListener("click", (e) => {
  if(!e.target.closest(".combo")) {
    document.getElementById("work_list").classList.remove("show");
  }
});

function toggleEtc(cbId, wrapId) {
  const cb = document.getElementById(cbId);
  document.getElementById(wrapId).style.display = cb.checked ? "block" : "none";
  generateImage();
}

function toggleRiskChildren(id) {
  const block = document.getElementById(id);
  if(block.classList.contains("hidden")) {
    block.classList.remove("hidden");
  } else {
    block.classList.add("hidden");
  }
  generateImage();
}

function saveNames() {
  if(!document.getElementById("remember_names").checked) return;
  localStorage.setItem("manager_name", document.getElementById("manager_name").value);
  localStorage.setItem("lm_name", document.getElementById("lm_name").value);
}

function loadSavedNames() {
  const m = localStorage.getItem("manager_name");
  const l = localStorage.getItem("lm_name");
  if(m || l) {
    document.getElementById("remember_names").checked = true;
    if(m) document.getElementById("manager_name").value = m;
    if(l) document.getElementById("lm_name").value = l;
  }
}

function clearSavedNames() {
  localStorage.removeItem("manager_name");
  localStorage.removeItem("lm_name");
  document.getElementById("manager_name").value = "";
  document.getElementById("lm_name").value = "";
  document.getElementById("remember_names").checked = false;
  generateImage();
  alert("저장된 성함 데이터가 초기화되었습니다.");
}

function onRememberToggle() {
  if(document.getElementById("remember_names").checked) {
    saveNames();
  } else {
    localStorage.removeItem("manager_name");
    localStorage.removeItem("lm_name");
  }
}

// 이미지 생성 드로잉 로직
function generateImage() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(templateImage, 0, 0);
  
  ctx.fillStyle = "#000";
  ctx.font = "bold 32px -apple-system, sans-serif";
  
  // 고정 텍스트 기입 예시
  ctx.fillText("SKO", 280, 248);
  
  // 가변 입력 데이터 바인딩 드로잉
  const startVal = document.getElementById("start_date")?.value || "";
  const endVal = document.getElementById("end_date")?.value || "";
  ctx.fillText(startVal ? startVal.replace("T", " ") : "", 280, 310);
  ctx.fillText(endVal ? endVal.replace("T", " ") : "", 280, 372);
  
  ctx.fillText(document.getElementById("location").value, 280, 434);
  ctx.fillText(document.getElementById("what_do").value, 280, 496);
  ctx.fillText(document.getElementById("inspector").value, 280, 558);
  
  // 기온 및 체감온도 캔버스 맵핑
  ctx.fillText(document.getElementById("real_temperature").value, 280, 620);
  ctx.fillText(document.getElementById("fake_temperature").value, 700, 620);
  
  ctx.fillText(document.getElementById("manager_name").value, 280, 750);
  ctx.fillText(document.getElementById("lm_name").value, 700, 750);
  
  finalImg.src = canvas.toDataURL("image/png");
}

function validateRequired() {
  const miss = [];
  if(!document.getElementById("location").value.trim()) miss.push("국소명(주소)");
  if(!document.getElementById("what_do").value.trim()) miss.push("작업공종");
  if(!document.getElementById("inspector").value.trim()) miss.push("투입인원(성함)");
  if(!document.getElementById("manager_name").value.trim()) miss.push("관리감독자 성함");
  if(!document.getElementById("lm_name").value.trim()) miss.push("발주처LM 성함");
  return miss;
}

function saveImage() {
  const miss = validateRequired();
  if (miss.length) {
    alert("아래 필수 항목이 작성되지 않아 저장할 수 없습니다:\n\n· " + miss.join("\n· "));
    return;
  }
  const a = document.createElement("a");
  const startVal = (document.getElementById("start_date")?.value || "").replace(/[:T]/g, "-");
  a.download = `평가표_${startVal}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
}

function setCurrentDateTime() {
  const now = new Date();
  const start = new Date(now.getTime() + 5 * 60 * 1000);
  const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
  const fmt = d => {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const s = document.getElementById('start_date'), e = document.getElementById('end_date');
  if (s) s.value = fmt(start);
  if (e) e.value = fmt(end);
  if (typeof generateImage === "function") generateImage();
}

window.onload = () => {
  loadSavedNames();
  setCurrentDateTime();
};
</script>
