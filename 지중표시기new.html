<script>
document.addEventListener("DOMContentLoaded", () => {
    const grid = document.querySelector(".gallery-grid");
    
    // 숨겨진 파일 입력창을 하나만 생성하여 통합 관리
    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.multiple = true;
    fileInput.style.display = "none";
    document.body.appendChild(fileInput);

    // 파일 처리 함수
    const handleFiles = (files) => {
        Array.from(files).forEach(file => {
            const card = document.createElement("div");
            card.className = "photo-card";
            card.innerHTML = `<button class="photo-del">×</button><img src="${URL.createObjectURL(file)}" style="width:100%"><br/>${file.name}`;
            grid.prepend(card);
        });
        if (typeof refreshPhotoNumber === 'function') refreshPhotoNumber();
        if (typeof updatePhotoCounterSafe === 'function') updatePhotoCounterSafe();
    };

    fileInput.addEventListener("change", (e) => {
        if (e.target.files.length) handleFiles(e.target.files);
        fileInput.value = ""; // 초기화
    });

    // 갤러리/카메라 버튼 바인딩
    document.getElementById("galleryBtn")?.addEventListener("click", (e) => {
        e.preventDefault();
        fileInput.removeAttribute("capture");
        fileInput.click();
    });

    document.getElementById("fabCamera")?.addEventListener("click", (e) => {
        e.preventDefault();
        fileInput.setAttribute("capture", "environment");
        fileInput.click();
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const grid = document.querySelector(".gallery-grid");
    const counter = document.getElementById("photoCounter");
    
    // 1. 단일 파일 입력창 생성 (카메라/갤러리 통합)
    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.multiple = true;
    fileInput.style.display = "none";
    document.body.appendChild(fileInput);

    // 2. 사진 카드 생성 및 번호/정보 갱신 함수
    function refreshLayout() {
        const cards = grid.querySelectorAll(".photo-card");
        counter.textContent = `🖼️ 총 사진: ${cards.length}장`;
        cards.forEach((card, i) => {
            let no = card.querySelector(".photo-no");
            if (!no) {
                no = document.createElement("div");
                no.className = "photo-no";
                card.prepend(no);
            }
            no.textContent = String(i + 1).padStart(3, "0");
        });
    }

    // 3. 파일 처리 로직
    fileInput.addEventListener("change", (e) => {
        Array.from(e.target.files).forEach(file => {
            const card = document.createElement("div");
            card.className = "photo-card";
            card.innerHTML = `
                <button class="photo-del" onclick="this.parentElement.remove(); refreshLayout();">×</button>
                <img src="${URL.createObjectURL(file)}" style="width:100%; aspect-ratio:1/1; object-fit:cover;">
                <br/>${file.name}
            `;
            grid.prepend(card);
        });
        refreshLayout();
        fileInput.value = ""; // 초기화
    });

    // 4. 버튼 이벤트 바인딩
    document.getElementById("galleryBtn").addEventListener("click", (e) => {
        e.preventDefault();
        fileInput.removeAttribute("capture");
        fileInput.click();
    });

    document.getElementById("fabCamera").addEventListener("click", (e) => {
        e.preventDefault();
        fileInput.setAttribute("capture", "environment");
        fileInput.click();
    });
});
</script>
