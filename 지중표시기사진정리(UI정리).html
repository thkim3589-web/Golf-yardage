<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; background: #ffffff; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* 헤더 */
        .header { background: #003399; color: white; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* 현장 정보 */
        .site-info { background: #eef2f8; padding: 12px; border-radius: 10px; border: 1px solid #d1d9e6; margin-bottom: 15px; }
        
        /* 자재 관리 */
        .material-box { border: 1px solid #d1d9e6; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .material-row { display: flex; gap: 10px; margin-bottom: 8px; font-weight: bold; }
        
        /* 버튼 그리드 */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .bg-blue { background: #0056b3; }
        .bg-green { background: #28a745; }
        .bg-purple { background: #6f42c1; }
        .bg-gray { background: #6c757d; }
        .bg-red { background: #dc3545; }
        
        /* 갤러리 */
        .gallery-title { margin-top: 20px; font-weight: bold; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .photo-card { border: 1px solid #ddd; border-radius: 8px; padding: 5px; text-align: center; font-size: 11px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <strong>현장 사진 관리</strong>
        <span>👤 관리자: 이영희</span>
    </div>

    <div class="site-info">
        📍 현장 ID : [달서구CD1234]
    </div>
    <div style="margin-bottom:15px; font-weight: bold;">🖼️ 총 사진: 3장 / 신규: [0장]</div>

    <div class="material-box">
        <div style="margin-bottom: 10px; font-weight: bold;">자재 수량 관리</div>
        <div class="material-row">기설합: [0] 🔨 못: [0] 🟠 스티커: [0]</div>
        <div class="material-row">신설합: [0] 🔧 못: [0] ⚪ 스티커: [0] 🥫 락카: [0]</div>
    </div>

    <div class="btn-grid">
        <button class="btn bg-blue">📸 촬영</button>
        <button class="btn bg-blue">🖼️ 갤러리</button>
        <button class="btn bg-green">📊 엑셀 저장</button>
        <button class="btn bg-purple">📁 ZIP 압축</button>
        <button class="btn bg-gray">💾 데이터 백업</button>
        <button class="btn bg-gray">🔄 데이터 복원</button>
        <button class="btn bg-red">🗑️ 개별 삭제</button>
        <button class="btn bg-red">🚨 전체 삭제</button>
    </div>

    <div class="gallery-title">갤러리</div>
    <div class="gallery-grid">
        <div class="photo-card">001<br>site_001.jpg<br>2024.05.20</div>
        <div class="photo-card">002<br>site_002.jpg<br>2024.05.20</div>
        <div class="photo-card">003<br>site_003.jpg<br>2024.05.20</div>
    </div>
</div>

</body>
</html>
